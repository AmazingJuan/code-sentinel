services:
  - type: web
    name: code-sentinel-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/main
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: DATABASE_URL
        sync: false
      # No migrations exist yet; schema auto-sync keeps the database in step with the entities.
      - key: DB_SYNCHRONIZE
        value: "true"
      # Comma-separated allow-list of browser origins. Unset keeps CORS open (a warning is logged).
      - key: CORS_ORIGINS
        sync: false

