name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  secret-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect path changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cli:
              - 'apps/cli/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-cli.yml'
            backend:
              - 'apps/backend/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-backend.yml'
            frontend:
              - 'apps/frontend/**'
              - '!apps/frontend/code-sentinel-2/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-pages.yml'
            docker:
              - 'docker-compose.yml'
              - 'apps/backend/Dockerfile'
              - 'apps/frontend/Dockerfile'
              - 'apps/frontend/nginx.conf'
              - '.github/workflows/ci.yml'

  cli:
    name: CLI Checks (Lint, Test, Build)
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      needs.changes.outputs.cli == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: apps/cli/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint CLI
        run: pnpm run lint

      - name: Run CLI unit tests
        run: pnpm test

      - name: Build CLI
        env:
          CODE_SENTINEL_API_URL: ${{ secrets.CODE_SENTINEL_API_URL || secrets.VITE_API_URL || 'https://code-sentinel-api.onrender.com' }}
        run: pnpm run build

  backend:
    name: Backend Checks (Lint, Unit, Integration, Coverage, Build)
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      needs.changes.outputs.backend == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: apps/backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Backend
        run: pnpm run lint

      - name: Run unit tests with coverage
        run: pnpm run test:cov

      - name: Run integration tests
        run: pnpm run test:integration

      - name: Build Backend
        run: pnpm run build

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage-report
          path: apps/backend/coverage
          retention-days: 14

  frontend:
    name: Frontend Checks (Lint, Types, Unit, Build)
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/frontend
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Frontend (oxlint & eslint)
        run: pnpm run lint

      - name: Type check (vue-tsc)
        run: pnpm run type-check

      - name: Run frontend unit tests
        run: pnpm run test:unit --run

      - name: Build Frontend
        run: pnpm run build

  docker-validation:
    name: Docker & Compose Integrity
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate docker compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        run: docker compose build --parallel

  ci-status:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - changes
      - cli
      - backend
      - frontend
      - docker-validation
    if: always()
    steps:
      - name: Evaluate pipeline results
        run: |
          echo "Evaluating CI pipeline status:"
          echo "  Secret scan:       ${{ needs.secret-scan.result }}"
          echo "  Changes detection: ${{ needs.changes.result }}"
          echo "  CLI checks:        ${{ needs.cli.result }}"
          echo "  Backend checks:    ${{ needs.backend.result }}"
          echo "  Frontend checks:   ${{ needs.frontend.result }}"
          echo "  Docker validation: ${{ needs.docker-validation.result }}"

          for res in "${{ needs.secret-scan.result }}" \
                     "${{ needs.changes.result }}" \
                     "${{ needs.cli.result }}" \
                     "${{ needs.backend.result }}" \
                     "${{ needs.frontend.result }}" \
                     "${{ needs.docker-validation.result }}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "::error::One or more upstream CI jobs failed or were cancelled."
              exit 1
            fi
          done

          echo "All executed CI checks passed successfully!"
