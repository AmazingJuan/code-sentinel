name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # 0. Detect Workspace Changes (Path-Conditional CD)
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Workspace Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Paths Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
            backend:
              - 'apps/backend/**'
            cli:
              - 'apps/cli/**'

  # ---------------------------------------------------------------------------
  # 1. Security & Secret Detection (Gitleaks)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------------------------------------------------------------------------
  # 2. CLI Toolsuite (apps/cli)
  # ---------------------------------------------------------------------------
  cli:
    name: CLI Checks (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: apps/cli/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint CLI
        run: pnpm run lint

      - name: Run CLI unit tests
        run: pnpm test

      - name: Build CLI
        env:
          CODE_SENTINEL_API_URL: ${{ secrets.CODE_SENTINEL_API_URL || secrets.VITE_API_URL || 'https://code-sentinel-api.onrender.com' }}
        run: pnpm run build

  # ---------------------------------------------------------------------------
  # 3. Backend API (apps/backend)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend Checks (Lint, Unit, Integration, Coverage, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: apps/backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Backend
        run: pnpm run lint

      - name: Run unit tests with coverage
        run: pnpm run test:cov

      - name: Run integration tests
        run: pnpm run test:integration

      - name: Build Backend
        run: pnpm run build

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: apps/backend/coverage
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4. Frontend Application (apps/frontend)
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend Checks (Lint, Types, Unit, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Frontend (oxlint & eslint)
        run: pnpm run lint

      - name: Type check (vue-tsc)
        run: pnpm run type-check

      - name: Run frontend unit tests
        run: pnpm run test:unit --run

      - name: Build Frontend
        run: pnpm run build

  # ---------------------------------------------------------------------------
  # 5. Docker Compose & Container Integrity
  # ---------------------------------------------------------------------------
  docker-validation:
    name: Docker & Compose Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build --parallel

  # ---------------------------------------------------------------------------
  # 6. CI Status Gate (Single Required Status Check for Branch Protection)
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - cli
      - backend
      - frontend
      - docker-validation
    if: always()
    steps:
      - name: Evaluate pipeline results
        run: |
          echo "Evaluating CI pipeline status:"
          echo "  Secret scan:       ${{ needs.secret-scan.result }}"
          echo "  CLI checks:        ${{ needs.cli.result }}"
          echo "  Backend checks:    ${{ needs.backend.result }}"
          echo "  Frontend checks:   ${{ needs.frontend.result }}"
          echo "  Docker validation: ${{ needs.docker-validation.result }}"

          if [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.cli.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.docker-validation.result }}" != "success" ]; then
            echo "::error::One or more upstream CI jobs failed."
            exit 1
          fi

          echo "All CI checks passed successfully!"

  # ---------------------------------------------------------------------------
  # 7. CD: Deploy Frontend to GitHub Pages (Path-Conditional)
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend (GitHub Pages)
    runs-on: ubuntu-latest
    needs: [ci-status, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.frontend == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/frontend
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Build frontend for GitHub Pages
        working-directory: apps/frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          CODE_SENTINEL_API_URL: ${{ secrets.CODE_SENTINEL_API_URL || secrets.VITE_API_URL || 'https://code-sentinel-api.onrender.com' }}
        run: |
          pnpm run build
          # SPA 404 fallback for GitHub Pages client-side routing
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # 8. CD: Trigger Backend Deployment (Render Free Web Service - Path-Conditional)
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend (Render Deploy Hook)
    runs-on: ubuntu-latest
    needs: [ci-status, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_HOOK != ''
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Disparando despliegue de backend en Render..."
          curl -f -X POST "$RENDER_HOOK"

  # ---------------------------------------------------------------------------
  # 9. CD: Publish CLI to npm Registry (Path-Conditional)
  # ---------------------------------------------------------------------------
  publish-cli:
    name: Publish CLI (npm Registry)
    runs-on: ubuntu-latest
    needs: [ci-status, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.cli == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install CLI dependencies
        working-directory: apps/cli
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        working-directory: apps/cli
        env:
          CODE_SENTINEL_API_URL: ${{ secrets.CODE_SENTINEL_API_URL || secrets.VITE_API_URL || 'https://code-sentinel-api.onrender.com' }}
        run: pnpm run build

      - name: Publish to npm
        working-directory: apps/cli
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing Code Sentinel CLI to npm..."
          pnpm publish --access public --no-git-checks
