name: Deploy Backend (Render)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '!apps/backend/README.md'
      - '!**.md'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_HOOK != ''
        run: |
          echo "Triggering backend deploy on Render..."
          curl --fail --silent --show-error -X POST "$RENDER_HOOK" > /dev/null
      - name: Skip notification if hook not configured
        if: env.RENDER_HOOK == ''
        run: |
          echo "RENDER_DEPLOY_HOOK_URL is not configured in the repository secrets. Skipping deploy."
