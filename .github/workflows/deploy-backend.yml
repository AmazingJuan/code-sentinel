name: Deploy Backend (Render)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '!apps/backend/README.md'
      - '!**.md'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_HOOK != ''
        run: |
          echo "Disparando despliegue de backend en Render..."
          curl -f -X POST "$RENDER_HOOK"
      - name: Skip notification if hook not configured
        if: env.RENDER_HOOK == ''
        run: |
          echo "RENDER_DEPLOY_HOOK_URL no esta configurado en los secrets del repositorio. Saltando despliegue."
