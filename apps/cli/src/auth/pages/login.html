<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Sentinel - CLI Authentication</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f293d;
      --primary: #10b981;
      --primary-hover: #059669;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --error: #ef4444;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.25rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--primary);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: bold;
      font-size: 1.1rem;
    }
    .logo-text {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.025em;
    }
    .logo-text span { color: var(--primary); }
    .subtitle {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.5rem;
      font-family: var(--font-mono);
    }
    input {
      width: 100%;
      background: #060911;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.7rem 0.85rem;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }
    .btn {
      width: 100%;
      background: var(--primary);
      color: #04100c;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .demo-section {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    .demo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .demo-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .demo-pill {
      font-size: 0.65rem;
      font-family: var(--font-mono);
      background: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }
    .demo-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .demo-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text);
      transition: border-color 0.2s, background-color 0.2s;
    }
    .demo-btn:hover {
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.05);
      color: var(--primary);
    }
    .demo-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .demo-role { font-weight: 600; color: #fff; }
    .demo-email { color: var(--muted); font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="badge">&gt;_</div>
      <div class="logo-text">code<span>sentinel</span></div>
    </div>

    <p class="subtitle">Sign in with your account to authorize the Code Sentinel CLI.</p>

    <div id="error-alert" class="alert alert-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" type="email" required autocomplete="email" placeholder="you@company.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>

      <button id="submit-btn" type="submit" class="btn">Sign in</button>
    </form>

    <div class="demo-section">
      <div class="demo-header">
        <span class="demo-title">Demo Accounts (1-Click Login)</span>
        <span class="demo-pill">Instant</span>
      </div>
      <div class="demo-buttons">
        <button type="button" class="demo-btn" id="demo-btn-demo" onclick="quickLogin('demo@code-sentinel.local', 'Demo1234!')">
          <span class="demo-role">Demo Analyst</span>
          <span class="demo-email">demo@code-sentinel.local</span>
        </button>
        <button type="button" class="demo-btn" id="demo-btn-admin" onclick="quickLogin('admin@code-sentinel.local', 'Admin1234!')">
          <span class="demo-role">Administrator</span>
          <span class="demo-email">admin@code-sentinel.local</span>
        </button>
        <button type="button" class="demo-btn" id="demo-btn-analyst" onclick="quickLogin('analyst@code-sentinel.local', 'Analyst1234!')">
          <span class="demo-role">Security Analyst</span>
          <span class="demo-email">analyst@code-sentinel.local</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorAlert = document.getElementById('error-alert');

    function setFormDisabled(disabled) {
      submitBtn.disabled = disabled;
      document.getElementById('email').disabled = disabled;
      document.getElementById('password').disabled = disabled;
      document.querySelectorAll('.demo-btn').forEach(btn => btn.disabled = disabled);
    }

    function quickLogin(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      form.dispatchEvent(new Event('submit'));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setFormDisabled(true);
      submitBtn.innerText = 'Authenticating...';
      errorAlert.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (response.ok && data.success) {
          window.location.href = '/success';
        } else {
          errorAlert.innerText = data.error || 'Invalid credentials. Please try again.';
          errorAlert.style.display = 'block';
          setFormDisabled(false);
          submitBtn.innerText = 'Sign in';
        }
      } catch (err) {
        errorAlert.innerText = 'Could not connect to the backend server: ' + err.message;
        errorAlert.style.display = 'block';
        setFormDisabled(false);
        submitBtn.innerText = 'Sign in';
      }
    });
  </script>
</body>
</html>
