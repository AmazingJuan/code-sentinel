<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <linearGradient id="cs-bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cs-shield" x1="45" y1="35" x2="135" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cs-accent" x1="60" y1="65" x2="120" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="180" height="180" rx="36" fill="url(#cs-bg)" stroke="#1e293b" stroke-width="3" />

  <!-- Shield Shape -->
  <path d="M90 32 L136 52 C136 94 116 128 90 148 C64 128 44 94 44 52 Z" 
        fill="#10b981" fill-opacity="0.14" 
        stroke="url(#cs-shield)" stroke-width="6" stroke-linejoin="round" />

  <!-- Terminal Chevron: > -->
  <path d="M72 74 L88 88 L72 102" 
        stroke="url(#cs-shield)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Terminal Cursor: _ -->
  <path d="M96 102 L114 102" 
        stroke="url(#cs-accent)" stroke-width="6" stroke-linecap="round" />
</svg>
